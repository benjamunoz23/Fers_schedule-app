name: Construir APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Generar íconos
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Permisos de alarmas y notificaciones
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c "EXACT_ALARM" android/app/src/main/AndroidManifest.xml
      - name: Sincronizar
        run: npx cap sync android
      - name: Usar llave de firma fija
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fers-magic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
